name: AI Chronicals News — Free Autopilot

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:00 UTC (08:00 Pakistan Standard Time).
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ai-chronicals-news-free-autopilot
  cancel-in-progress: true

jobs:
  newsroom-training-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out newsroom repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm install
      - name: Run newsroom tests
        run: npm test
      - name: Build free training readiness report
        run: |
          mkdir -p reports
          node --input-type=module -e 'import { buildNewsroomOperationsReport } from "./lib/newsroom-operations.js"; console.log(JSON.stringify(buildNewsroomOperationsReport(), null, 2))' > reports/newsroom-operations-report.json
      - name: Upload training readiness report
        uses: actions/upload-artifact@v4
        with:
          name: free-newsroom-autopilot-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
