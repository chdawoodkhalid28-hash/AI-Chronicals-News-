name: Cloudflare temporary preview deployment

on:
  push:
    branches:
      - cloudflare-test-deployment

permissions:
  contents: read

jobs:
  deploy-temporary-preview:
    name: Deploy isolated temporary Cloudflare preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test Cloudflare preview worker and admin sessions
        run: node --test tests/cloudflare-worker.test.js tests/cloudflare-admin-auth.test.js tests/cloudflare-queue.test.js

      - name: Deploy temporary preview without account credentials
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.102.0 deploy --temporary --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          PREVIEW_URL="$(grep -Eo 'https://ai-chronicals-news-test\.[a-z0-9-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Temporary preview URL: $PREVIEW_URL"

      - name: Smoke test the live Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_STATUS="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$PREVIEW_URL/api/health" || true)"
          echo "Live health endpoint returned HTTP $HEALTH_STATUS"
          if [ "$HEALTH_STATUS" != "200" ]; then
            cat /tmp/health.json || true
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const h = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
            if (h.status !== "partial-preview" || h.backendMigration !== "in_progress" || h.publishing !== "DISABLED" || h.ok !== false) {
              throw new Error("Live health response did not match the safe preview contract");
            }
            console.log("Live health endpoint: PASS");
          '
          for PAGE in /index.html /admin.html; do
            PAGE_STATUS="$(curl --retry 10 --retry-delay 3 --retry-all-errors --silent --show-error --output /tmp/page.html --dump-header /tmp/page.headers --write-out '%{http_code}' "$PREVIEW_URL$PAGE")"
            echo "Static asset $PAGE returned HTTP $PAGE_STATUS"
            if [ "$PAGE_STATUS" != "200" ]; then
              cat /tmp/page.headers
              head -c 1000 /tmp/page.html || true
              exit 1
            fi
            grep -qi '<html' /tmp/page.html
          done
          echo "Static index and admin page delivery: PASS"
          STATUS="$(curl --silent --show-error --output /tmp/admin-api.json --write-out '%{http_code}' "$PREVIEW_URL/api/admin/queue")"
          test "$STATUS" = "401"
          node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/admin-api.json", "utf8"));
            if (body.error !== "Admin session required") throw new Error("Unauthenticated admin API was not rejected");
            console.log("Live unauthenticated admin API denial: PASS");
          '
