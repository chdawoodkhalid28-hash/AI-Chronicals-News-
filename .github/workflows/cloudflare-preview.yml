name: Cloudflare preview deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Deploy isolated Cloudflare preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test Cloudflare preview worker
        run: node --test tests/cloudflare-worker.test.js

      - name: Deploy preview environment only
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
