name: Cloudflare preview checks

on:
  push:
    branches:
      - cloudflare-test-deployment
  pull_request:
    branches:
      - cloudflare-test-deployment
      - feat/cloudflare-news-crud

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run Cloudflare preview worker tests
        run: node --test tests/cloudflare-worker.test.js tests/cloudflare-admin-auth.test.js tests/cloudflare-queue.test.js tests/cloudflare-news-api.test.js
